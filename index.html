<!doctype html>
<html lang="id">
<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Glow Shelf - rak kecantikan favorit teman-temanku">
  <title>Glow Shelf</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div>
        <h1>Glow Shelf ✦</h1>
        <p>Rak kecantikan favorit - Gienah Anugerah, 2440304026</p>
      </div>
      <button id="theme-toggle" type="button">Mode gelap</button>
    </div>
  </header>

  <nav class="site-nav" aria-label="Menu utama">
    <div class="container">
      <a href="#produk">Produk</a>
      <a href="#favorit">Favorit</a>
      <a href="#form-saran">Form</a>
    </div>
  </nav>

  <main class="container">

    <section id="ringkasan" aria-labelledby="judul-ringkasan">
      <h2 id="judul-ringkasan">Ringkasan Data</h2>
      <div id="stats" class="stats"></div>
    </section>

    <section id="produk" aria-labelledby="judul-produk">
      <h2 id="judul-produk">Semua Produk</h2>
      <div id="status" role="status"></div>
      <div id="product-list" class="grid"></div>
    </section>

    <section id="favorit" aria-labelledby="judul-favorit">
      <h2 id="judul-favorit">Favoritku</h2>
      <div id="favorite-list" class="grid"></div>
    </section>

    <section id="form-saran" aria-labelledby="judul-form">
      <h2 id="judul-form">Kirim Saran Produk</h2>
      <form id="saran-form" novalidate>
        <div class="field">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email">
          <p class="error" id="error-email"></p>
        </div>
        <div class="field">
          <label for="email2">Konfirmasi email</label>
          <input type="email" id="email2" name="email2">
          <p class="error" id="error-email2"></p>
        </div>
        <button type="submit">Kirim</button>
        <p id="form-status" role="status"></p>
      </form>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Gienah Anugerah - NIM 2440304026 - Kelas A1_TEKOM_24</p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
